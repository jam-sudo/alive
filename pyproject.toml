[project]
name = "alive"
version = "0.0.1"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "anndata",
    "scanpy",
    "h5py",
    "pyyaml",
    "pytest",
    "ruff",
]

[project.optional-dependencies]
features = [
    "torch",
    "transformers",
    "fair-esm",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alive"]
