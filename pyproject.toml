[project]
name = "alive"
version = "0.0.1"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "anndata",
    "scanpy",
    "h5py",
    "pyyaml",
    "pytest",
    "ruff",
]

[project.scripts]
alive = "alive.cli:main"

[project.optional-dependencies]
features = [
    "torch",
    "transformers",
    "fair-esm",
]

[tool.ruff]
line-length = 100
extend-exclude = [
    # Immutable as-run evidence: preserved byte-for-byte for provenance and never
    # imported or executed by the maintained codebase. See the archive README and
    # the 2026-07-11 probe-rerun runbook.
    "docs/superpowers/evidence/2026-07-11-gears-decision-probe/harness",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alive"]
