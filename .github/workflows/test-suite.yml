name: Test suite (Linux x86_64)

# Every green result this project has recorded so far came from a developer
# macOS host, where the kernel-isolation contract in
# src/alive/compose/network_isolation.py cannot be exercised at all: the seccomp
# policy is defined only for x86_64 and its BPF filter kills any other audit
# architecture. The low-level primitive test and the real
# launcher->execve->driver wiring test are both skipped elsewhere. This workflow
# runs the suite on a real x86_64 Linux kernel and fails unless both execute.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Full suite on Linux x86_64
    runs-on: ubuntu-24.04
    # 75, not 45: the suite grew from 1822 to 2085 test functions (same count, `git grep -c
    # '^\s*def test_' -- tests` at 85e9749 and at this commit) and from 3142 to 3210 collected
    # tests (suite summaries at the PR #15 base and on this tree) while this cap stayed put. Measured: the last green run on this runner
    # class took 44m04s (43a1964) and run 34505058006 was cancelled by the cap at 98% with
    # zero failures. A cap that a green suite cannot reliably fit under stops being a hang
    # detector and becomes a coin flip; 75 keeps ~1.7x headroom over the measured green.
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history, not depth 1. The repository-history checks below read
          # blobs at the commits the archived kernel-isolation evidence names, and
          # those commit objects do not exist in a shallow checkout -- the checks
          # pass on any full clone and fail only here, which is how they shipped
          # once already.
          fetch-depth: 0
          persist-credentials: false

      - name: Assert the runner is a real Linux x86_64 kernel
        run: |
          set -euo pipefail
          # A non-x86_64 or emulated runner would silently prove nothing: the
          # policy refuses to build on another architecture, and the filter's
          # first instruction kills a process whose audit architecture differs.
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          uname -srmo

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Sync the locked environment
        run: |
          set -euo pipefail
          # --locked refuses to silently re-resolve: the environment must be the
          # committed uv.lock, not whatever resolves today.
          uv sync --locked
          uv --version
          uv run python -V

      - name: Ruff
        run: |
          set -euo pipefail
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Full test suite
        # Deselect the repository-history checks: they run after the receipt is
        # built, because the receipt requires a JUnit with zero failures and one
        # of those checks fires exactly when the archived kernel evidence has gone
        # stale. Leaving it here made the check self-blocking -- a legitimate
        # closure change would fail the suite, skip the receipt build, and leave
        # deleting the check as the only way to produce the evidence its own
        # failure message demands.
        run: uv run pytest -q -p no:randomly -m "not repo_history" --junitxml=junit.xml

      - name: Build the canonical kernel-isolation proof receipt
        run: |
          set -euo pipefail
          # The builder checks the exact classname/name roster and requires both
          # the low-level kernel test and the real launcher->execve->driver test.
          # It reads --workflow through git and requires that file to be this
          # worktree's canonical workflow, byte-identical to the blob recorded at
          # --head-sha, so a receipt cannot commit to a workflow the commit under
          # test never contained. Its canonical receipt can be imported into
          # version-controlled activation evidence; this artifact is transport,
          # not durable proof.
          uv run python scripts/compose/build_kernel_isolation_ci_receipt.py \
            --junit junit.xml \
            --workflow .github/workflows/test-suite.yml \
            --output kernel-isolation-ci-receipt.json \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --runner-os "$(uname -s)" \
            --runner-architecture "$(uname -m)" \
            --kernel-release "$(uname -r)"

      - name: Upload JUnit and the canonical proof receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ github.sha }}
          path: |
            junit.xml
            kernel-isolation-ci-receipt.json
          if-no-files-found: error
          # Transport window only. Operational approval requires a subsequent
          # version-controlled archive wrapper under activation evidence.
          #
          # An explicit per-upload value overrides the repository retention
          # setting DOWNWARD, so raising the repository limit to 400 days did
          # nothing while this said 90 -- including for the run that will back
          # the seal. Keep this equal to the repository limit; the archive's
          # committed primary bytes, not this window, are the durable record.
          retention-days: 400

      - name: Repository-history checks
        # Gates the branch but NOT the receipt: these run after the upload so a
        # stale-evidence verdict cannot block producing the evidence that would
        # refresh it. They need real history, hence fetch-depth 0 above.
        if: always()
        run: uv run pytest -q -p no:randomly -m repo_history
