name: Test suite (Linux x86_64)

# Every green result this project has recorded so far came from a developer
# macOS host, where the kernel-isolation contract in
# src/alive/compose/network_isolation.py cannot be exercised at all: the seccomp
# policy is defined only for x86_64 and its BPF filter kills any other audit
# architecture. The low-level primitive test and the real
# launcher->execve->driver wiring test are both skipped elsewhere. This workflow
# runs the suite on a real x86_64 Linux kernel and fails unless both execute.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Full suite on Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Assert the runner is a real Linux x86_64 kernel
        run: |
          set -euo pipefail
          # A non-x86_64 or emulated runner would silently prove nothing: the
          # policy refuses to build on another architecture, and the filter's
          # first instruction kills a process whose audit architecture differs.
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          uname -srmo

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Sync the locked environment
        run: |
          set -euo pipefail
          # --locked refuses to silently re-resolve: the environment must be the
          # committed uv.lock, not whatever resolves today.
          uv sync --locked
          uv --version
          uv run python -V

      - name: Ruff
        run: |
          set -euo pipefail
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Full test suite
        run: uv run pytest -q -p no:randomly --junitxml=junit.xml

      - name: Build the canonical kernel-isolation proof receipt
        run: |
          set -euo pipefail
          # The builder checks the exact classname/name roster and requires both
          # the low-level kernel test and the real launcher->execve->driver test.
          # It reads --workflow through git and requires that file to be this
          # worktree's canonical workflow, byte-identical to the blob recorded at
          # --head-sha, so a receipt cannot commit to a workflow the commit under
          # test never contained. Its canonical receipt can be imported into
          # version-controlled activation evidence; this artifact is transport,
          # not durable proof.
          uv run python scripts/compose/build_kernel_isolation_ci_receipt.py \
            --junit junit.xml \
            --workflow .github/workflows/test-suite.yml \
            --output kernel-isolation-ci-receipt.json \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --runner-os "$(uname -s)" \
            --runner-architecture "$(uname -m)" \
            --kernel-release "$(uname -r)"

      - name: Upload JUnit and the canonical proof receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ github.sha }}
          path: |
            junit.xml
            kernel-isolation-ci-receipt.json
          if-no-files-found: error
          # Transport window only. Operational approval requires a subsequent
          # version-controlled archive wrapper under activation evidence.
          #
          # An explicit per-upload value overrides the repository retention
          # setting DOWNWARD, so raising the repository limit to 400 days did
          # nothing while this said 90 -- including for the run that will back
          # the seal. Keep this equal to the repository limit; the archive's
          # committed primary bytes, not this window, are the durable record.
          retention-days: 400
