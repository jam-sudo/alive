name: Test suite (Linux x86_64)

# Every green result this project has recorded so far came from a developer
# macOS host, where the kernel-isolation contract in
# src/alive/compose/network_isolation.py cannot be exercised at all: the seccomp
# policy is defined only for x86_64 and its BPF filter kills any other audit
# architecture, so the one test that establishes the kernel property is
# skipif-ed away. This workflow runs the suite on a real x86_64 Linux kernel and
# fails unless that specific test actually executed.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Full suite on Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Assert the runner is a real Linux x86_64 kernel
        run: |
          set -euo pipefail
          # A non-x86_64 or emulated runner would silently prove nothing: the
          # policy refuses to build on another architecture, and the filter's
          # first instruction kills a process whose audit architecture differs.
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          uname -srmo

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Sync the locked environment
        run: |
          set -euo pipefail
          # --locked refuses to silently re-resolve: the environment must be the
          # committed uv.lock, not whatever resolves today.
          uv sync --locked
          uv --version
          uv run python -V

      - name: Ruff
        run: |
          set -euo pipefail
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Full test suite
        run: uv run pytest -q -p no:randomly --junitxml=junit.xml

      - name: Prove the kernel-isolation test actually executed
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          NAME = "test_linux_policy_and_sealed_receipt_validate_in_the_active_process"

          cases = [tc for tc in ET.parse("junit.xml").iter("testcase") if tc.get("name") == NAME]
          if len(cases) != 1:
              sys.exit(f"::error::expected exactly one {NAME}, found {len(cases)}")

          outcome = [child.tag for child in cases[0] if child.tag in {"skipped", "failure", "error"}]
          if outcome:
              sys.exit(
                  f"::error::{NAME} did not execute cleanly ({outcome}); "
                  "this run is NOT evidence that the kernel isolation holds"
              )

          print(f"{NAME} executed and passed on a real x86_64 Linux kernel.")
          print(
              "This establishes that the seccomp policy behaves as specified. "
              "It does NOT establish that any production pod is correctly configured; "
              "that still requires the pod's own capture-runtime evidence."
          )
          PY

      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ github.sha }}
          path: junit.xml
          if-no-files-found: error
          retention-days: 14
