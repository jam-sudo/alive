# COMPOSE-K562-v1 Phase 2 — lifecycle ACTIVE, scientific RELEASE-BLOCKED.
# `status: active` records the 2026-06-30 lifecycle transition; it does not by itself
# authorize a real Norman sealed study. Scientific execution additionally requires zero
# activation blockers, validated byte-pinned evidence, a valid owner ActivationRecord,
# and a clean committed tree. Only then may the A100 open the COMPOSE seal exactly once.
# Spec: docs/superpowers/specs/2026-06-22-compose-epistasis-operator-design.md (§10).
# Flipping status to `active` changes config_sha256 -> a NEW run identity (intended at activation);
# the pre-activation candidate values are otherwise unchanged.

protocol: COMPOSE-K562-v1
phase: 2
status: active

activation_requirements:
  - real_norman_phi_rank_and_condition_report
  - regime_specific_detectable_effect_analysis
  - finalized_norman_data_card_and_sha256
  - gears_cpa_reproducible_dependency_lock
  - independent_compose_outcome_store_and_access_audit
  - phase2_plan_metric_leakage_and_seal_integration_tests

data:
  source: "scPerturb NormanWeissman2019 (Zenodo 10.5281/zenodo.13350497)"
  file: NormanWeissman2019_filtered.h5ad
  license: "CC BY 4.0"
  cell_line: K562
  modality: CRISPRa            # NOT CRISPRi — never transfer claims to Replogle KD
  perturbation_key: perturbation
  control_token: control
  combo_sep: "_"

eligibility:                   # outcome-independent (CLAUDE.md#invariants); NEVER by GI strength
  min_cells_per_gene: 50
  min_cells_per_pair: 50
  require_esm_feature: true     # ESM-2 sequence available for both genes (may shrink counts)

split:                          # unit = perturbation PAIR (claim unit, §6)
  seed: 11                      # a priori (first registered seed; count ~= median); NOT count-selected
  calibration_fraction: 0.6
  eligibility_before_split: true
  pair_canonicalization: lexicographic_min_max
  pair_deduplication: true
  string_order: utf8_lexicographic
  gene_permutation: numpy_generator_pcg64
  calibration_gene_count: round_half_to_even
  roles:
    combo_calibration: both genes in calibration gene set
    sealed_double_unseen: neither gene in calibration gene set
    sealed_single_unseen: exactly one gene in calibration gene set
  both_seen_test: deferred      # would shrink |Cal| below rank floor; not built in Phase 2

response_space:
  transform: [normalize_total_median, log1p]
  n_hvg: 1500                   # top variable genes on control cells
  pca_dim: 50
  fit_roles: [control, singles]  # NO double-cell leakage; no sealed access

factor_z:
  total_k_grid: [4, 6, 8]       # total z dimension; sym_dim = 10/21/36
  expression_dims: [2, 4, 6]    # total_k - esm_projection_dim
  include_esm: true
  esm_model: esm2_t33_650M_UR50D_mean_pool
  esm_projection_dim: 2
  esm_projection_method: pca_without_outcomes
  esm_projection_fit_roles: [singles]
  rank_gate: exact_phi_rank_and_condition_on_combo_calibration
  selection: calibration_oof_gene_disjoint   # OOF folds mirror the sealed gene-disjoint regime

identification:
  estimator: ridge_lsq
  unregularized_solver: svd_lstsq_minimum_norm
  regularized_solver: svd_ridge_filter_factors
  lambda_grid: [0.0, 0.001, 0.01, 0.1]
  selection: calibration_oof_gene_disjoint
  unregularized_oof_rank_policy: require_full_rank_each_train_fold
  rank_tolerance_rule: max_shape_times_float64_eps_times_sigma_max
  # The registered lambda_grid is RELATIVE, not absolute. Ridge is not
  # scale-invariant and Phi is bilinear in z, so z -> cz makes an absolute penalty
  # act as lambda/c^4 while nothing upstream bounds ||z||; the same absolute lambda
  # also means a different relative penalty at each k_total, because cond rises
  # across the registered dimension grid. The applied penalty is
  # lambda * sigma_max(Phi_calibration)^2, which cancels both. sigma_max is not a
  # new quantity: it is the value the rank_tolerance_rule above is already built
  # from. lambda = 0.0 stays exactly 0.0, so the unregularized rank policy and the
  # conditioning ceiling are unaffected. Equivalent to rescaling the factor bank by
  # sqrt(sigma_max) (verified to one ulp), applied here so the bank stays a pure
  # function of the encoders and k_total rather than depending on the split.
  lambda_scaling: calibration_sigma_max_squared
  oof_folds: 3
  uncovered_tolerance: 0.75
  # Admissibility bound on cond(Phi). Screened in TWO places inside selection:
  # per candidate k_total on the FULL calibration design, and per unregularized
  # (lam == 0.0) OOF TRAIN fold. The two remove different amounts -- a whole
  # k_total at every lambda, versus that k_total's lam=0.0 candidate alone.
  # Anchor is data-free: 1/sqrt(float64 eps) ~= 6.7e7, rounded up.
  # Invariant to a uniform rescale of z (to round-off); moves ~11 orders under
  # ESM-vs-expression block imbalance. An over-ceiling k_total is recorded
  # non-viable; only if EVERY candidate is, selection itself fails (exit 10).
  # Spelling matters: YAML 1.1 needs <digits>.<digits>[eE][+-]<digits>, so both
  # `1.0e8` and `1e+8` parse as STRINGS, which the loader rejects rather than
  # coercing. A plain integer would also have worked; the digest depends on the
  # parsed value, not the spelling.
  condition_ceiling: 1.0e+8

metric:
  pair_error: mean_squared_error_over_pca_coordinates
  primary: paired_relative_error_reduction
  formula: "(mean(error_comparator) - mean(error_l1)) / max(mean(error_comparator), 1e-12)"
  distance: response_space_mse        # in the PCA-50 response space
  aggregation: ratio_of_mean_pair_errors
  material_margin_vs_additive: 0.05
  learned_comparator_margin: 0.0
  nonfinite_or_missing_policy: invalidate_run
  secondary:
    - gi_explained_fraction           # 1-SSE/SST vs the zero-GI reference (not noise-ceiling normalized)
    - gi_structure_recovery           # sign/class vs known GI, > chance
  secondary_are_verdict_gates: false

inference:
  method: max_deviation_bootstrap     # reuse alive.eval.bootstrap (CARTOGRAPHER)
  comparator_family: [additive, gears, cpa, id_only, l3_symmetric_mlp]
  resampling_unit: perturbation_pair
  shared_resamples_across_contrasts: true
  family_confidence: 0.95
  bootstrap_replicates: 10000

regimes:
  headline_candidate: double_unseen
  registered_secondary: [single_unseen]
  power_status: unestablished_activation_blocker
  report_all: true

baselines:                            # roster FROZEN before any outcome (§9 / §6.1)
  additive: delta_g + delta_h         # primary null floor
  lower_bounds: [no_change, perturbation_mean]
  id_only: linear_no_bilinear
  gears:                              # representation method-locked; worker cannot self-select
    package: gears
    revision: null
    environment_status: unpinned_activation_blocker
    prediction_representation: raw_pseudobulk_approximation   # GEARS predicts pseudobulk
    approximation_bias_report_sha256: null   # explicit activation blocker until bias measured
  cpa:
    package: cpa-tools
    revision: null
    environment_status: unpinned_activation_blocker
    prediction_representation: cell_raw_counts   # exact per-cell; change only by config revision
    approximation_bias_report_sha256: null   # must stay null for an exact representation
  # L3 was registered as `l3_hypernetwork` until 2026-08-20. The implementation
  # never was one: it is a two-hidden-layer tanh MLP on the symmetric pair
  # feature [z_g + z_h, |z_g - z_h|] over a FIXED z. Measured — after fit, z is
  # byte-identical to the input and the 6 trainable arrays are the MLP's own
  # weights/biases; no network generates the operator and nothing is end-to-end
  # in z. The MODEL is unchanged by this rename; only the registered name is,
  # so that the ladder does not claim an unconstrained-capacity arm it does not
  # have. Owner decision #6 (option B), 2026-08-20:
  # docs/superpowers/2026-08-17-compose-ablation-ladder-decisions.md
  ablation_ladder: [l1_bilinear_identifiable, l2_saturation, l3_symmetric_mlp]  # L1 = headline

leakage_control:
  baseline_training_roles: [singles, combo_calibration]   # GEARS/CPA NEVER see sealed pairs in training
  sealed_outcomes_touched_before_freeze: false

phasing:
  phase_2a: dev-stage (real delta/eps + z_g + fit L1/L2/L3+id_only + train GEARS/CPA + dev metrics + futility); NO seal
  phase_2b: freeze all methods -> open sealed_double_unseen + sealed_single_unseen ONCE -> metric + simultaneous inference -> verdict

futility:                             # development-stage stop (§10); seal stays closed, count 0
  conditions: [dev_oof_delta_below_threshold, rank_condition_fail, measurability_fail]
  dev_oof_metric: paired_relative_error_reduction_vs_additive
  dev_oof_threshold: 0.0

seal:                                 # independent of TG-K562 (§6.3)
  artifacts_root: artifacts/compose
  run_id_inputs: [config, data_card, sequence_mapping, raw_data_sha256]
  sealed_access_max: 1
  minimum_sealed_n: 1                  # structural non-empty result floor; NOT power adequacy
  write_once: true

seeds:
  split_seed: 11                       # fixed partition (single sealed split)
  registered_seeds: [11, 23, 37]       # model OOF / ensemble determinism

verdict:                              # two axes (spec §4.5)
  method_axis: [METHOD_VALIDATED, METHOD_NOT_VALIDATED]
  sealed_axis: [GI_LEARNABLE_WIN, PARTIAL, NO_DISTINCT_WIN, FUTILITY_STOPPED, INVALID]
  gi_learnable_win:
    additive_simultaneous_lower_bound_gt: 0.05
    every_learned_comparator_simultaneous_lower_bound_gt: 0.0
  partial:
    additive_simultaneous_lower_bound_gt: 0.05
    learned_family_condition: failed
  no_distinct_win:
    additive_simultaneous_lower_bound_lte: 0.05
  integrity_clause_disclaimer: "structural run-internal self-check, NOT an independent audit"
